# Continuous integration for Jeeves.
#
# Until now nothing ran the test suite automatically — 890+ Vitest tests, a
# required Playwright golden path, and coverage thresholds all existed but
# were only ever run by hand. This workflow makes the gate in CLAUDE.md §5
# ("run full test suite, fix regressions") actually enforceable on a PR.
#
# Independent jobs, run in parallel, so a lint/type/unit failure reports without waiting on the e2e
# build:
#   verify    — typecheck, lint, unit tests WITH coverage (vitest.config.ts's
#               thresholds fail the run on regression).
#   e2e       — the Playwright golden path. playwright.config.ts owns its own
#               webServer (db:seed && build && serve on port 3117; here the
#               Turbopack standalone server the image ships), so this job only
#               installs the browser and runs the suite.
#   agent-bundle-webpack — the packaged-agent check, which still needs webpack.
#   container — the deploy/podman/Containerfile runner and migrator images build,
#               then run against Postgres in production mode and must answer
#               /api/health. Nothing is pushed. Before this, a COPY of
#               a deleted path (public/, a667ec3) broke the image unnoticed.
#   postgres-integrity — the real-PostgreSQL suite (npm run test:postgres) on a
#               socket-only cluster started in the job. The unit tests run on
#               PGlite, which has no roles and no real concurrency.
#   production-smoke — starts a real production-mode server against a throwaway
#               Postgres and checks the wire (scripts/smoke-production.ts). Every
#               other job runs the demo, so a production-only failure (proxy.ts
#               once answered 500 to every signed-out page) stayed green.
#
# Playwright supplies an independent test-only signing key; visitor entry is passwordless.
#
# JEEVES_MODE=demo is set on the verify and e2e jobs: an unset mode is
# production, which closes the demo doors these jobs exercise. The
# production-smoke job deliberately sets no mode at all.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch cancels the previous run — these jobs build
# the app twice over, so queueing stale runs wastes a lot of runner minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # An unset JEEVES_MODE means production (lib/config/deployment-mode.ts).
      # These jobs build and test the demo, so they say so explicitly.
      JEEVES_MODE: demo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          # Chromium is only needed by the e2e job; skip the ~150MB download
          # during this job's postinstall.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      # Fails on any high or critical advisory in a RUNTIME dependency.
      # devDependencies are excluded: they never reach the deployed server.
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Coverage thresholds live in vitest.config.ts and fail the run on
      # regression. File parallelism is disabled in that config (PGlite
      # instances contend and time out the beforeEach hooks otherwise).
      - name: Unit tests + coverage
        run: npx vitest run --coverage

  e2e:
    name: Playwright golden path
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # An unset JEEVES_MODE means production (lib/config/deployment-mode.ts).
      # These jobs build and test the demo, so they say so explicitly.
      JEEVES_MODE: demo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run e2e suite
        run: npm run test:e2e
        env:
          # Build with Turbopack and serve .next/standalone/server.js, as the
          # container image and Vercel do. Locally the default is webpack.
          PLAYWRIGHT_SERVER: standalone

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # scripts/check-agent-bundle.cjs only understands webpack's runtime
  # (.next/server/webpack-runtime.js), so it keeps a webpack build of its own
  # until it is ported to the Turbopack output. The e2e job above is what
  # covers the build that ships.
  agent-bundle-webpack:
    name: Packaged agent runtime (webpack)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JEEVES_MODE: demo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - name: Build with webpack
        run: npm run build -- --webpack
        env:
          DATA_PROVIDER: mock

      # Relocates only deployable files and forbids network/source-tree reads.
      - name: Verify packaged agent runtime
        run: node scripts/check-agent-bundle.cjs

  container:
    name: Container image builds and runs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Throwaway values for a database and a network that exist for this job
      # only; nothing here guards anything.
      CI_NETWORK: jeeves-ci
      CI_DB_PASSWORD: jeeves-ci-only
    steps:
      - uses: actions/checkout@v4

      # The same command docs/deploy-podman.md gives, with docker in place of
      # podman. Build context is the repo root; .dockerignore keeps it small.
      # No push, no registry login: images are built and run on this runner only.
      - name: Build image
        run: docker build -f deploy/podman/Containerfile -t jeeves:ci .

      # A bare build skips this stage (it is not the last one), so a migrator
      # that cannot reach drizzle/ or tsx broke unnoticed.
      - name: Build migrator image
        run: docker build -f deploy/podman/Containerfile --target migrator -t jeeves-migrator:ci .

      - name: Start Postgres
        run: |
          docker network create "$CI_NETWORK"
          docker run -d --name jeeves-ci-db --network "$CI_NETWORK" \
            -e POSTGRES_USER=jeeves -e POSTGRES_PASSWORD="$CI_DB_PASSWORD" -e POSTGRES_DB=jeeves \
            postgres:16-alpine
          for i in $(seq 1 30); do
            docker exec jeeves-ci-db pg_isready -U jeeves -d jeeves && exit 0
            sleep 2
          done
          docker logs jeeves-ci-db
          exit 1

      - name: Run the migrator
        run: |
          docker run --rm --network "$CI_NETWORK" \
            -e DATABASE_URL="postgres://jeeves:${CI_DB_PASSWORD}@jeeves-ci-db:5432/jeeves" \
            jeeves-migrator:ci

      # Production mode: no mode variable is passed (unset means
      # production), so this runs the image's real boot checks. The image,
      # not the checkout, serves the request, with the container's read-only
      # root filesystem as an operator would run it.
      - name: Run the image and wait for /api/health
        run: |
          # JEEVES_DB_ALLOW_OWNER_ROLE: throwaway CI database with one role that owns everything.
          docker run -d --name jeeves-ci-app --network "$CI_NETWORK" -p 3000:3000 \
            --read-only --tmpfs /tmp \
            -e DATABASE_URL="postgres://jeeves:${CI_DB_PASSWORD}@jeeves-ci-db:5432/jeeves" \
            -e JEEVES_DB_ALLOW_UNVERIFIED=same-host \
            -e JEEVES_DB_ALLOW_OWNER_ROLE=1 \
            -e DATA_PROVIDER=db \
            -e JEEVES_COOKIE_SECRET="$(openssl rand -hex 32)" \
            -e APP_BASE_URL=https://jeeves.example.test \
            -e JEEVES_TENANT_ID=ci \
            -e JEEVES_TRUSTED_PROXY_HOPS=none \
            jeeves:ci
          for i in $(seq 1 45); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/health)" = "200" ]; then
              echo "GET /api/health answered 200"
              exit 0
            fi
            sleep 2
          done
          echo "GET /api/health did not answer 200 within 90 seconds"
          docker logs jeeves-ci-app
          docker logs jeeves-ci-db
          exit 1

      - name: Container logs
        if: ${{ failure() }}
        run: |
          docker logs jeeves-ci-app || true
          docker logs jeeves-ci-db || true

  postgres-integrity:
    name: Real PostgreSQL integrity tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      # tests/postgres/private-postgres.ts connects only to a socket-only
      # cluster whose directory is named jeeves-review-pg-*, with the socket in
      # a directory called "socket" next to "data", and a database named
      # jeeves_review_integrity_*. It refuses a TCP listener.
      - name: Start a socket-only PostgreSQL cluster
        run: |
          PG_BIN=$(ls -d /usr/lib/postgresql/*/bin 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -z "$PG_BIN" ]; then
            sudo apt-get update
            sudo apt-get install -y postgresql-16
            PG_BIN=/usr/lib/postgresql/16/bin
          fi
          ROOT="${RUNNER_TEMP}/jeeves-review-pg-ci"
          DB="jeeves_review_integrity_ci_${GITHUB_RUN_ID}"
          mkdir -p "$ROOT/socket"
          "$PG_BIN/initdb" -D "$ROOT/data" -U jeeves_ci --auth=trust --no-sync
          "$PG_BIN/pg_ctl" -D "$ROOT/data" -l "$ROOT/postgres.log" -w \
            -o "-c listen_addresses='' -c unix_socket_directories=$ROOT/socket -c fsync=off" start
          "$PG_BIN/createdb" -h "$ROOT/socket" -U jeeves_ci "$DB"
          {
            echo "PG_BIN=$PG_BIN"
            echo "PG_CI_ROOT=$ROOT"
            echo "JEEVES_REVIEW_TEST_PG_MARKER=disposable-review-integrity"
            echo "JEEVES_REVIEW_TEST_PG_SOCKET=$ROOT/socket"
            echo "JEEVES_REVIEW_TEST_PG_DATABASE=$DB"
            echo "JEEVES_REVIEW_TEST_PG_USER=jeeves_ci"
          } >> "$GITHUB_ENV"

      - name: Run PostgreSQL integrity tests
        run: npm run test:postgres

      - name: Postgres log
        if: ${{ failure() }}
        run: cat "$PG_CI_ROOT/postgres.log" || true

      - name: Stop PostgreSQL
        if: ${{ always() }}
        run: '"$PG_BIN/pg_ctl" -D "$PG_CI_ROOT/data" -m immediate stop || true'

  production-smoke:
    name: Production-mode smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A throwaway database for this job only. The smoke test stamps its
    # database "production" for good, so it refuses any database that is not
    # named jeeves_smoke_<name>; the password below guards nothing.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jeeves
          POSTGRES_PASSWORD: jeeves-ci-only
          POSTGRES_DB: jeeves_smoke_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jeeves -d jeeves_smoke_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    # No JEEVES_MODE and no DATA_PROVIDER here: unset is production, and the
    # smoke test builds the server's environment from scratch anyway. Only the
    # build steps name a mode, exactly as the Containerfile's builder stage does.
    env:
      SMOKE_DATABASE_URL: postgres://jeeves:jeeves-ci-only@localhost:5432/jeeves_smoke_ci
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      # The build the container image ships today: demo-capable, mock data at
      # build time (deploy/podman/Containerfile, builder stage).
      - name: Build as the container image does
        run: npm run build
        env:
          DATA_PROVIDER: mock
          JEEVES_MODE: demo

      # Migrates and stamps the database, proves four bad configurations refuse
      # to boot, then checks redirects, 404s, 401s and headers on the wire.
      - name: Smoke test in production mode
        run: npm run smoke:production

      # A production image compiles demo mode out (JEEVES_DEMO_ENABLED=0).
      # JEEVES_MODE=demo must then be ignored at run time.
      - name: Build with demo mode compiled out
        run: npm run build
        env:
          DATA_PROVIDER: mock
          JEEVES_DEMO_ENABLED: "0"

      # Starts the server WITH JEEVES_MODE=demo; every production check must
      # still pass.
      - name: Smoke test the demo-locked build
        run: npm run smoke:production
        env:
          SMOKE_DEMO_LOCKED: "1"
